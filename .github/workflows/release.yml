name: Release

# Publishes the arm64 binary the Pi installer downloads. Trigger by pushing a
# semver tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish arm64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate templates
        run: go tool templ generate

      - name: Cross-compile for linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          # Stamp the tag so the running binary can compare itself against the
          # latest published release.
          go build -trimpath \
            -ldflags="-s -w -X github.com/cristian/holocron/internal/version.Version=${GITHUB_REF_NAME}" \
            -o holocron-linux-arm64 ./cmd/holocron
          sha256sum holocron-linux-arm64 > holocron-linux-arm64.sha256

      # The installer ships with the release too. It runs as root on the Pi, and
      # downloading it from main means running whatever is on main at that
      # moment; as an asset it is pinned to the tag and has a checksum.
      - name: Checksum the installer
        run: sha256sum scripts/install.sh | sed 's|scripts/||' > install.sh.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent: re-running the workflow on an existing tag, or moving a
          # tag, updates the assets instead of failing with "release already
          # exists" and leaving a red run behind.
          assets=(holocron-linux-arm64 holocron-linux-arm64.sha256 scripts/install.sh install.sh.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Holocron $TAG" \
              --generate-notes
          fi
